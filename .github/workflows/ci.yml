name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff format --check src/asd/reproduce tests/test_dspark_*.py tests/test_reference_artifacts.py tests/test_sglang_patch.py
      - run: ruff check src/asd/reproduce tests/test_dspark_*.py tests/test_reference_artifacts.py tests/test_sglang_patch.py

  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v

  torch-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e .
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest tests.test_dspark_torch_rule tests.test_adapter -v
